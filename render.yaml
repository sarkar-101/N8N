services:

- type: web
  name: n8n
  env: node
  plan: free
  
  buildCommand: npm install n8n
  
  startCommand: npx n8n
  
  envVars:
  
  - key: N8N_BASIC_AUTH_ACTIVE
    value: true
  
  - key: N8N_BASIC_AUTH_USER
    value: admin
  
  - key: N8N_BASIC_AUTH_PASSWORD
    value: admin123
  
  - key: GENERIC_TIMEZONE
    value: Asia/Karachi
  
  - key: NODE_VERSION
    value: 20
